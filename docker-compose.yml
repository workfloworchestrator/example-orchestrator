x-netbox: &netbox
  build:
    context: docker/netbox
    dockerfile: Dockerfile
  depends_on:
    - postgres
    - redis
  env_file:
    - ./docker/netbox/netbox.env
    - path: ./docker/overrides/netbox/netbox.env
      required: false
  user: "1000:0"
  healthcheck:
    start_period: 360s
    timeout: 3s
    interval: 15s
    test: "curl -w '%{http_code}' -o /dev/null -s http://127.0.0.1:8080/api/ | grep -Eq '200|403'"
  volumes:
    - ./docker/netbox/configuration:/etc/netbox/config:z,ro
    - ./docker/netbox/reports:/etc/netbox/reports:z,ro
    - ./docker/netbox/scripts:/etc/netbox/scripts:z,ro
    - ./docker/netbox/entrypoint.sh:/etc/netbox/entrypoint.sh
    - netbox-media-files:/opt/netbox/netbox/media:z
    - ./docker/netbox/data.json:/etc/netbox/data.json

services:
  postgres:
    container_name: postgres
    image: "pgvector/pgvector:pg17"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nwa
      POSTGRES_PASSWORD: nwa
      POSTGRES_DB: orchestrator-core
    volumes:
      - db-data:/var/lib/postgresql/data/
      - ./docker/postgresql:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "--username",
          "nwa",
          "--dbname",
          "orchestrator-core",
        ]
      interval: "3s"
      timeout: "2s"
      retries: 20
      start_period: "5s"

  redis:
    container_name: redis
    image: docker.io/redis:8-alpine
    command:
      - sh
      - -c # this is to evaluate the $REDIS_PASSWORD from the env
      - redis-server --requirepass $$REDIS_PASSWORD ## $$ because of docker-compose
    healthcheck:
      test: '[ $$(redis-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]'
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5
    env_file:
      - ./docker/redis/redis.env
      - path: ./docker/overrides/redis/redis.env
        required: false
    volumes:
      - netbox-redis-cache-data:/data

  embeddings:
    container_name: embeddings
    platform: linux/amd64
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    profiles:
      - embeddings
    env_file:
      - ./docker/embeddings/embeddings.env
      - path: ./docker/overrides/embeddings/embeddings.env
        required: false
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rover-compose:
    container_name: rover-compose
    build:
      context: docker/federation
      dockerfile: rover.Dockerfile
    depends_on:
      orchestrator:
        condition: service_healthy
      netbox:
        condition: service_healthy
    environment:
      - APOLLO_ELV2_LICENSE=accept
      - APOLLO_TELEMETRY_DISABLED=true
    command: supergraph compose --config /app/supergraph-config.yaml --output /app/supergraph.graphql --skip-update-check
    volumes:
      - ./docker/federation:/app

  federation:
    container_name: federation
    image: ghcr.io/apollographql/router:v2.11.0
    ports:
      - "4000:4000"
    depends_on:
      rover-compose:
        condition: service_completed_successfully
    environment:
      - APOLLO_TELEMETRY_DISABLED=true
    command: --config /app/router-config.yaml --supergraph /app/supergraph.graphql
    volumes:
      - ./docker/federation:/app

  netbox:
    <<: *netbox
    container_name: netbox
    expose:
      - "8080"
    ports:
      - "8000:8080"
    entrypoint:
      ["/opt/netbox/docker-entrypoint.sh", "/etc/netbox/entrypoint.sh"]

  netbox-worker:
    <<: *netbox
    container_name: netbox-worker
    depends_on:
      netbox:
        condition: service_healthy
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      start_period: 20s
      timeout: 3s
      interval: 15s
      test: "ps -aux | grep -v grep | grep -q rqworker || exit 1"

  orchestrator-ui:
    container_name: orchestrator-ui
    image: ${ORCH_UI_TAG:-ghcr.io/workfloworchestrator/example-orchestrator-ui:latest}
    env_file:
      - ./docker/orchestrator-ui/orchestrator-ui.env
      - path: ./docker/overrides/orchestrator-ui/orchestrator-ui.env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      orchestrator:
        condition: service_started

  orchestrator:
    container_name: orchestrator
    # Keep this tag in sync with the orchestrator-core pin in pyproject.toml:
    # the image ships a preinstalled venv, and running `db upgrade heads` with
    # a newer image against a database used by the pinned version (or vice
    # versa) leaves alembic revisions the other version cannot resolve.
    image: ${ORCH_BACKEND_TAG:-ghcr.io/workfloworchestrator/orchestrator-core:5.1.0}
    env_file:
      - ./docker/orchestrator/orchestrator.env
      - path: ./docker/overrides/orchestrator/orchestrator.env
        required: false
    environment:
      LSO_ENABLED: ${LSO_ENABLED:-False}
    ports:
      - "8080:8080"
      - "5678:5678" #Enable Python debugger
    expose:
      - 5678 #Enable Python debugger
    volumes:
      - ./db:/home/orchestrator/db
      - ./workflows:/home/orchestrator/workflows
      - ./products:/home/orchestrator/products
      - ./migrations:/home/orchestrator/migrations
      - ./docker:/home/orchestrator/etc
      - ./main.py:/home/orchestrator/main.py
      - ./wsgi.py:/home/orchestrator/wsgi.py
      - ./settings.py:/home/orchestrator/settings.py
      - ./graphql_utils:/home/orchestrator/graphql_utils
      - ./utils:/home/orchestrator/utils
      - ./services:/home/orchestrator/services
      - ./pyproject.toml:/home/orchestrator/pyproject.toml
      - ./alembic.ini:/home/orchestrator/alembic.ini
      - ./translations:/home/orchestrator/translations
      - ./templates:/home/orchestrator/templates
      - ./docker/orchestrator/.bashrc:/home/orchestrator/.bashrc
      - ${CORE_DIR:-./docker/overrides/orchestrator-core}:/home/orchestrator/orchestrator-core
    entrypoint: ["/home/orchestrator/etc/orchestrator/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
        required: false
    healthcheck:
      start_period: 15s
      timeout: 5s
      interval: 5s
      retries: 20
      test: /home/orchestrator/etc/orchestrator/is_healthy.py

  lso:
    container_name: orchestrator-lso
    profiles:
      - lso
    build:
      context: ./docker/lso/
      dockerfile: Dockerfile
    env_file:
      - ./docker/lso/lso.env
      - path: ./docker/overrides/lso/lso.env
        required: false
    ports:
      - "8001:8000"
    volumes:
      - ./ansible/plays_and_roles:/app/demo/ansible/playbooks
      - ./ansible/inventory:/opt/ansible_inventory
      - ./docker/lso/config.json:/app/config.json

  # AI agents (--profile agents) — see the "AI agents" section in the README

  wfo-agent:
    container_name: wfo-agent
    image: ${AGENT_TAG:-ghcr.io/workfloworchestrator/orchestrator-agent:latest}
    profiles:
      - agents
    env_file:
      - ./docker/wfo-agent/wfo-agent.env
      - path: ./docker/overrides/wfo-agent/wfo-agent.env
        required: false
    environment:
      # pydantic-ai model string, e.g. "openai:gpt-5-mini" or "anthropic:claude-sonnet-5"
      AGENT_MODEL: ${AGENT_MODEL:-openai:gpt-5-mini}
      # API key for the model provider; set it in a root `.env` file
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    ports:
      - "8082:8080"
    depends_on:
      orchestrator:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # The agent verifies its tool contract against the orchestrator's MCP
    # server at startup; restart covers races around orchestrator reloads
    restart: unless-stopped

  netbox-mcp:
    container_name: netbox-mcp
    image: docker.io/netboxlabs/netbox-mcp-server:latest
    profiles:
      - agents
    env_file:
      - ./docker/netbox-mcp/netbox-mcp.env
      - path: ./docker/overrides/netbox-mcp/netbox-mcp.env
        required: false
    ports:
      - "8092:8000"
    depends_on:
      netbox:
        condition: service_healthy

  # planner-agent and inventory-agent are declarative docker-agent (cagent)
  # agents: model, prompt and toolsets live in each service's agent.yaml (the
  # compose analog of a kagent Agent resource), served over A2A by the
  # official docker/docker-agent image (pin in sync with new releases as
  # needed - the config dialect still evolves).
  #
  # `--listen <service-name>:8080` binds the container address so the A2A
  # agent card advertises a URL peers can actually reach (docker-agent has no
  # separate public-url flag, and a wildcard listen would advertise
  # localhost). The card captures the container IP at startup, so after
  # `docker compose restart inventory-agent` also restart planner-agent.
  inventory-agent:
    container_name: inventory-agent
    image: docker/docker-agent:1.125.0
    profiles:
      - agents
    command: ["serve", "a2a", "/config/agent.yaml", "--listen", "inventory-agent:8080"]
    environment:
      # API key for the model declared in agent.yaml; from the root `.env`
      OPENAI_API_KEY: ${AGENT_API_KEY:-}
      TELEMETRY_ENABLED: "false"
    volumes:
      # agent.yaml plus the instructions.md it references
      - ./docker/inventory-agent:/config:ro
    ports:
      - "8083:8080"
    depends_on:
      - netbox-mcp

  planner-agent:
    container_name: planner-agent
    image: docker/docker-agent:1.125.0
    profiles:
      - agents
    command: ["serve", "a2a", "/config/agent.yaml", "--listen", "planner-agent:8080"]
    environment:
      # API key for the model declared in agent.yaml; from the root `.env`
      OPENAI_API_KEY: ${AGENT_API_KEY:-}
      TELEMETRY_ENABLED: "false"
    volumes:
      # agent.yaml plus the instructions.md it references
      - ./docker/planner-agent:/config:ro
    ports:
      - "8084:8080"
    depends_on:
      - wfo-agent
      - inventory-agent

  a2a-proxy:
    container_name: a2a-proxy
    # TEMPORARY: built from the feat/local-setup branch because the direct
    # agent URL option (PROXY_AGENT_URLS, needed to run without a kagent
    # controller) is not yet in a released image. Switch back to
    # image: ghcr.io/nren-agents/kagent-a2a-proxy:latest once it is merged
    # and released (> 0.0.13).
    build:
      context: https://github.com/nren-agents/kagent-a2a-proxy.git#feat/local-setup
    profiles:
      - agents
    env_file:
      - ./docker/a2a-proxy/a2a-proxy.env
      - path: ./docker/overrides/a2a-proxy/a2a-proxy.env
        required: false
    ports:
      - "8090:8080"
    depends_on:
      wfo-agent:
        condition: service_started
      planner-agent:
        condition: service_started

  mongodb:
    container_name: librechat-mongodb
    image: docker.io/mongo:8
    profiles:
      - agents
    command: mongod --noauth
    volumes:
      - librechat-mongo-data:/data/db

  librechat:
    container_name: librechat
    image: ghcr.io/danny-avila/librechat-dev:latest
    profiles:
      - agents
    env_file:
      - ./docker/librechat/librechat.env
      - path: ./docker/overrides/librechat/librechat.env
        required: false
    ports:
      - "3080:3080"
    volumes:
      - ./docker/librechat/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      - mongodb
      - a2a-proxy

volumes:
  netbox-media-files:
    driver: local
  librechat-mongo-data:
    driver: local
  db-data:
    driver: local
  netbox-redis-data:
    driver: local
  netbox-redis-cache-data:
    driver: local
