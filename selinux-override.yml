services:
  postgres:
    volumes:
      - ./docker/postgresql:/docker-entrypoint-initdb.d:z

  netbox:
    volumes:
      - ./docker/netbox/configuration:/etc/netbox/config:z,ro
      - ./docker/netbox/reports:/etc/netbox/reports:z,ro
      - ./docker/netbox/scripts:/etc/netbox/scripts:z,ro
      - ./docker/netbox/entrypoint.sh:/etc/netbox/entrypoint.sh:z
      - ./docker/netbox/data.json:/etc/netbox/data.json:z

  netbox-worker:
    volumes:
      - ./docker/netbox/configuration:/etc/netbox/config:z,ro
      - ./docker/netbox/reports:/etc/netbox/reports:z,ro
      - ./docker/netbox/scripts:/etc/netbox/scripts:z,ro
      - ./docker/netbox/entrypoint.sh:/etc/netbox/entrypoint.sh:z
      - ./docker/netbox/data.json:/etc/netbox/data.json:z

  librechat:
    volumes:
      - ./docker/librechat/librechat.yaml:/app/librechat.yaml:z,ro

  inventory-agent:
    volumes:
      - ./docker/inventory-agent:/config:z,ro

  planner-agent:
    volumes:
      - ./docker/planner-agent:/config:z,ro

  orchestrator:
    volumes:
      - ./db:/home/orchestrator/db:z
      - ./workflows:/home/orchestrator/workflows:z
      - ./products:/home/orchestrator/products:z
      - ./migrations:/home/orchestrator/migrations:z
      - ./docker:/home/orchestrator/etc:z
      - ./main.py:/home/orchestrator/main.py:z
      - ./wsgi.py:/home/orchestrator/wsgi.py:z
      - ./settings.py:/home/orchestrator/settings.py:z
      - ./graphql_utils:/home/orchestrator/graphql_utils:z
      - ./utils:/home/orchestrator/utils:z
      - ./services:/home/orchestrator/services:z
      - ./pyproject.toml:/home/orchestrator/pyproject.toml:z
      - ./alembic.ini:/home/orchestrator/alembic.ini:z
      - ./translations:/home/orchestrator/translations:z
      - ./templates:/home/orchestrator/templates:z
      - ./docker/orchestrator/.bashrc:/home/orchestrator/.bashrc:z
      - ${CORE_DIR:-./docker/overrides/orchestrator-core}:/home/orchestrator/orchestrator-core:z
